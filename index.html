<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172942"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><title>Kanji Handwriting Judge — Gate 0</title>  <script type="module" crossorigin src="./assets/index-BeWR4zFK.js"></script>
